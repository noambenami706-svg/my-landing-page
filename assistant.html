<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
button { border: none; cursor: pointer; font-family: inherit; background: none; }
input, select, textarea { border: none; outline: none; font-family: inherit; }

:root {
  --white:   #ffffff;
  --bg:      #f5f5f7;
  --card:    #ffffff;
  --brd:     #e8e8ed;
  --brd2:    #d1d1d6;
  --t1:      #1d1d1f;
  --t2:      #6e6e73;
  --t3:      #aeaeb2;
  --accent:  #0071e3;
  --accent-h:#0077ed;
  --ok:      #34c759;
  --danger:  #ff3b30;
  --warn:    #ff9500;
  --shadow:  0 1px 3px rgba(0,0,0,.08), 0 4px 16px rgba(0,0,0,.06);
  --shadow2: 0 2px 8px rgba(0,0,0,.12), 0 8px 32px rgba(0,0,0,.08);
  --rad:     16px;
  --rad-sm:  10px;
  --tr:      160ms ease;
}

body {
  background: var(--bg);
  color: var(--t1);
  font-family: 'Inter', sans-serif;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* ── LAYOUT ── */
.app {
  max-width: 900px;
  margin: 0 auto;
  padding: 2.5rem 1.5rem 4rem;
  display: flex;
  flex-direction: column;
  gap: 1.25rem;
}

/* ── HEADER ── */
.header {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: start;
  gap: 1rem;
  margin-bottom: .25rem;
}
.header-left {}
.greeting {
  font-size: 2rem;
  font-weight: 700;
  color: var(--t1);
  letter-spacing: -.5px;
  line-height: 1.15;
}
.sub-greeting {
  margin-top: .3rem;
  font-size: .875rem;
  color: var(--t2);
  font-weight: 400;
}

/* ── WEATHER PILL ── */
.weather-pill {
  display: flex;
  align-items: center;
  gap: .5rem;
  background: var(--card);
  border: 1px solid var(--brd);
  border-radius: 30px;
  padding: .5rem 1rem .5rem .75rem;
  box-shadow: var(--shadow);
  white-space: nowrap;
}
.weather-pill-icon { font-size: 1.2rem; }
.weather-pill-temp {
  font-size: .875rem;
  font-weight: 600;
  color: var(--t1);
}
.weather-pill-desc {
  font-size: .75rem;
  color: var(--t2);
}
.weather-pill-loc {
  font-size: .7rem;
  color: var(--t3);
  margin-left: .25rem;
}
.weather-loading {
  font-size: .78rem;
  color: var(--t3);
  padding: .5rem 1rem;
  background: var(--card);
  border: 1px solid var(--brd);
  border-radius: 30px;
}
.temp-toggle-btns {
  display: flex;
  gap: 2px;
  margin-left: .5rem;
}
.temp-toggle-btn {
  font-size: .65rem;
  font-weight: 600;
  padding: 2px 6px;
  border-radius: 6px;
  color: var(--t3);
  transition: all var(--tr);
}
.temp-toggle-btn.on {
  background: var(--accent);
  color: #fff;
}

/* ── COMMAND BAR ── */
.cmd-wrap { position: relative; }
.cmd-bar {
  display: flex;
  align-items: center;
  gap: .75rem;
  background: var(--card);
  border: 1px solid var(--brd);
  border-radius: 12px;
  padding: .85rem 1.1rem;
  box-shadow: var(--shadow);
  transition: border-color var(--tr), box-shadow var(--tr);
}
.cmd-bar:focus-within {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(0,113,227,.12);
}
.cmd-icon {
  font-size: .95rem;
  flex-shrink: 0;
}
.cmd-input {
  flex: 1;
  font-size: .875rem;
  color: var(--t1);
  background: transparent;
}
.cmd-input::placeholder { color: var(--t3); }
.cmd-hint {
  font-size: .72rem;
  color: var(--t3);
  flex-shrink: 0;
  border: 1px solid var(--brd2);
  border-radius: 5px;
  padding: 1px 6px;
  font-family: monospace;
}

/* ── SUGGESTIONS ── */
.suggestions {
  position: absolute;
  top: calc(100% + .5rem);
  left: 0; right: 0;
  background: var(--card);
  border: 1px solid var(--brd);
  border-radius: var(--rad-sm);
  box-shadow: var(--shadow2);
  overflow: hidden;
  z-index: 50;
  display: none;
}
.suggestions.open { display: block; }
.sug-item {
  display: flex;
  align-items: center;
  gap: .75rem;
  padding: .7rem 1rem;
  border-bottom: 1px solid var(--brd);
  cursor: pointer;
  transition: background var(--tr);
}
.sug-item:last-child { border-bottom: none; }
.sug-item:hover { background: var(--bg); }
.sug-cmd {
  font-size: .78rem;
  font-weight: 600;
  color: var(--accent);
  min-width: 90px;
}
.sug-desc { font-size: .78rem; color: var(--t2); }

/* ── GRID ── */
.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1.25rem;
  align-items: start;
}

/* ── CARD ── */
.card {
  background: var(--card);
  border: 1px solid var(--brd);
  border-radius: var(--rad);
  padding: 1.5rem;
  box-shadow: var(--shadow);
}
.card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1.25rem;
}
.card-title {
  font-size: .7rem;
  font-weight: 600;
  letter-spacing: .8px;
  text-transform: uppercase;
  color: var(--t3);
}
.card-count {
  font-size: .72rem;
  font-weight: 600;
  color: var(--accent);
  background: rgba(0,113,227,.08);
  padding: 2px 9px;
  border-radius: 20px;
}

/* ── PROGRESS ── */
.progress-wrap { margin-bottom: 1.1rem; }
.progress-track {
  height: 4px;
  background: var(--brd);
  border-radius: 4px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: var(--ok);
  border-radius: 4px;
  transition: width .4s ease;
}
.progress-labels {
  display: flex;
  justify-content: space-between;
  margin-top: .4rem;
}
.progress-labels span {
  font-size: .67rem;
  color: var(--t3);
}

/* ── FILTER TABS ── */
.filter-tabs {
  display: flex;
  gap: .25rem;
  margin-bottom: 1rem;
  background: var(--bg);
  border-radius: 10px;
  padding: 3px;
}
.filter-tab {
  flex: 1;
  text-align: center;
  font-size: .75rem;
  font-weight: 500;
  padding: .35rem .5rem;
  border-radius: 8px;
  color: var(--t2);
  transition: all var(--tr);
}
.filter-tab.on {
  background: var(--card);
  color: var(--t1);
  box-shadow: 0 1px 4px rgba(0,0,0,.1);
  font-weight: 600;
}

/* ── ADD ROW ── */
.add-row {
  display: flex;
  gap: .5rem;
  margin-bottom: 1rem;
}
.add-field {
  flex: 1;
  background: var(--bg);
  border: 1px solid var(--brd);
  border-radius: var(--rad-sm);
  padding: .6rem .9rem;
  font-size: .83rem;
  color: var(--t1);
  transition: border-color var(--tr), box-shadow var(--tr);
}
.add-field:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(0,113,227,.1);
  background: var(--white);
}
.add-field::placeholder { color: var(--t3); }
.add-field.sm { width: 82px; flex: none; }

.pri-sel {
  background: var(--bg);
  border: 1px solid var(--brd);
  border-radius: var(--rad-sm);
  padding: .6rem .5rem;
  font-size: .78rem;
  color: var(--t2);
  cursor: pointer;
  width: 66px;
  flex-shrink: 0;
  transition: border-color var(--tr);
}
.pri-sel:focus { border-color: var(--accent); }

.add-btn {
  background: var(--accent);
  color: #fff;
  border-radius: var(--rad-sm);
  padding: .6rem 1rem;
  font-size: .8rem;
  font-weight: 600;
  transition: background var(--tr), transform var(--tr);
  white-space: nowrap;
  flex-shrink: 0;
}
.add-btn:hover { background: var(--accent-h); }
.add-btn:active { transform: scale(.97); }

/* ── TASK ITEM ── */
.task-list { display: flex; flex-direction: column; }

.task-item {
  display: flex;
  align-items: flex-start;
  gap: .75rem;
  padding: .7rem 0;
  border-bottom: 1px solid var(--brd);
  animation: fadeUp .18s ease;
}
.task-item:last-child { border-bottom: none; }

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(4px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* THE CHECKBOX */
.cb {
  position: relative;
  width: 20px;
  height: 20px;
  flex-shrink: 0;
  margin-top: 1px;
}
.cb input[type="checkbox"] {
  position: absolute;
  opacity: 0;
  width: 100%; height: 100%;
  cursor: pointer;
  z-index: 1;
  margin: 0;
}
.cb-box {
  position: absolute;
  inset: 0;
  border: 2px solid var(--brd2);
  border-radius: 6px;
  background: var(--white);
  transition: all var(--tr);
  display: flex;
  align-items: center;
  justify-content: center;
}
.cb-box::after {
  content: '';
  width: 5px;
  height: 9px;
  border-right: 2px solid #fff;
  border-bottom: 2px solid #fff;
  transform: rotate(45deg) translateY(-1px);
  opacity: 0;
  transition: opacity var(--tr);
}
.cb input:checked ~ .cb-box {
  background: var(--ok);
  border-color: var(--ok);
}
.cb input:checked ~ .cb-box::after { opacity: 1; }
.cb input:focus-visible ~ .cb-box {
  box-shadow: 0 0 0 3px rgba(52,199,89,.25);
}

.task-text {
  flex: 1;
  font-size: .875rem;
  line-height: 1.45;
  color: var(--t1);
  transition: color var(--tr);
  padding-top: 1px;
}
.task-item.done .task-text {
  text-decoration: line-through;
  color: var(--t3);
}

.pri-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  flex-shrink: 0;
  margin-top: 7px;
}
.p-high { background: var(--danger); }
.p-med  { background: var(--warn); }
.p-low  { background: var(--ok); }

.del-btn {
  color: var(--t3);
  font-size: .8rem;
  padding: 2px 5px;
  border-radius: 5px;
  transition: color var(--tr), background var(--tr);
  flex-shrink: 0;
  margin-top: 1px;
  line-height: 1;
}
.del-btn:hover { color: var(--danger); background: rgba(255,59,48,.08); }

/* ── EMPTY ── */
.empty {
  text-align: center;
  padding: 2rem 1rem;
  color: var(--t3);
  font-size: .83rem;
}
.empty-icon { font-size: 1.5rem; margin-bottom: .5rem; }

/* ── EVENT ITEM ── */
.event-item {
  display: flex;
  align-items: flex-start;
  gap: .75rem;
  padding: .7rem 0;
  border-bottom: 1px solid var(--brd);
  animation: fadeUp .18s ease;
}
.event-item:last-child { border-bottom: none; }
.event-time-col {
  width: 56px;
  flex-shrink: 0;
  font-size: .72rem;
  font-weight: 600;
  color: var(--accent);
  padding-top: 2px;
  line-height: 1.2;
}
.event-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--accent);
  flex-shrink: 0;
  margin-top: 5px;
  opacity: .5;
}
.event-title {
  flex: 1;
  font-size: .875rem;
  color: var(--t1);
  line-height: 1.35;
}
.event-item.past .event-time-col,
.event-item.past .event-title { color: var(--t3); }
.event-item.past .event-dot { opacity: .2; }
.now-tag {
  font-size: .65rem;
  font-weight: 700;
  color: var(--ok);
  background: rgba(52,199,89,.1);
  border-radius: 6px;
  padding: 1px 7px;
  white-space: nowrap;
  align-self: flex-start;
  margin-top: 2px;
}

/* ── TOAST ── */
.toast {
  position: fixed;
  bottom: 2rem; left: 50%;
  transform: translateX(-50%) translateY(8px);
  background: var(--t1);
  color: #fff;
  padding: .6rem 1.25rem;
  border-radius: 30px;
  font-size: .8rem;
  font-weight: 500;
  opacity: 0;
  pointer-events: none;
  z-index: 200;
  white-space: nowrap;
  transition: opacity .22s ease, transform .22s ease;
  box-shadow: var(--shadow2);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── DATE STRIP ── */
.date-strip {
  display: flex;
  align-items: center;
  gap: 1rem;
}
.date-text {
  font-size: .78rem;
  color: var(--t2);
  font-weight: 400;
}

/* ── RESPONSIVE ── */
@media (max-width: 680px) {
  .grid { grid-template-columns: 1fr; }
  .header { grid-template-columns: 1fr; }
  .weather-pill { width: fit-content; }
  .greeting { font-size: 1.6rem; }
  .app { padding: 1.5rem 1rem 3rem; }
}
@media (max-width: 380px) {
  .add-row { flex-wrap: wrap; }
  .add-field.sm { width: 100%; flex: 1; }
}
</style>
</head>
<body>

<div class="app">

  <!-- HEADER -->
  <div class="header">
    <div class="header-left">
      <div class="greeting" id="greetingEl">Good morning</div>
      <div class="date-strip">
        <span class="date-text" id="dateEl"></span>
        <span class="date-text" id="clockEl" style="font-weight:600;color:#1d1d1f"></span>
      </div>
    </div>
    <div id="weatherWrap">
      <div class="weather-loading" id="weatherStatus">Fetching weather…</div>
    </div>
  </div>

  <!-- COMMAND BAR -->
  <div class="cmd-wrap">
    <div class="cmd-bar">
      <span class="cmd-icon">🔍</span>
      <input class="cmd-input" id="cmdInput" type="text"
        placeholder="add task buy groceries  ·  add event 3pm meeting  ·  note call mom">
      <span class="cmd-hint">↵</span>
    </div>
    <div class="suggestions" id="suggestions"></div>
  </div>

  <!-- GRID -->
  <div class="grid">

    <!-- TASKS -->
    <div class="card">
      <div class="card-header">
        <span class="card-title">Tasks</span>
        <span class="card-count" id="taskCount">0</span>
      </div>

      <div class="filter-tabs" id="filterTabs">
        <button class="filter-tab on" data-f="all">All</button>
        <button class="filter-tab" data-f="active">Active</button>
        <button class="filter-tab" data-f="done">Done</button>
      </div>

      <div class="progress-wrap">
        <div class="progress-track">
          <div class="progress-fill" id="progFill" style="width:0%"></div>
        </div>
        <div class="progress-labels">
          <span id="progLabel">0 of 0 done</span>
          <span id="progPct">0%</span>
        </div>
      </div>

      <div class="add-row">
        <input class="add-field" id="taskInput" type="text" placeholder="New task…">
        <select class="pri-sel" id="priSel">
          <option value="med">Med</option>
          <option value="high">High !</option>
          <option value="low">Low</option>
        </select>
        <button class="add-btn" id="taskAddBtn">Add</button>
      </div>

      <div class="task-list" id="taskList"></div>
    </div>

    <!-- SCHEDULE -->
    <div class="card">
      <div class="card-header">
        <span class="card-title">Today's Schedule</span>
        <span class="card-count" id="evCount">0</span>
      </div>

      <div class="add-row">
        <input class="add-field" id="evTitle" type="text" placeholder="Event title…">
        <input class="add-field sm" id="evTime" type="time">
        <button class="add-btn" id="evAddBtn">Add</button>
      </div>

      <div id="eventList"></div>
    </div>

  </div>
</div>

<div class="toast" id="toast"></div>

<script>
'use strict';

// ── STORAGE ───────────────────────────────────────────────
const S = {
  g: k => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  s: (k, v) => localStorage.setItem(k, JSON.stringify(v)),
};

let tasks  = S.g('pa2_tasks')  || [];
let events = S.g('pa2_events') || [];
let tUnit  = S.g('pa2_temp')   || 'C';
let tFilter = 'all';

function save() { S.s('pa2_tasks', tasks); S.s('pa2_events', events); }

// ── CLOCK ─────────────────────────────────────────────────
const DAYS   = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MFULL  = ['January','February','March','April','May','June','July','August','September','October','November','December'];

function tick() {
  const n   = new Date();
  const h   = n.getHours();
  const m   = String(n.getMinutes()).padStart(2,'0');
  const h12 = h % 12 || 12;
  const ap  = h >= 12 ? 'PM' : 'AM';

  document.getElementById('clockEl').textContent = `${h12}:${m} ${ap}`;
  document.getElementById('dateEl').textContent  =
    `${DAYS[n.getDay()]}, ${MFULL[n.getMonth()]} ${n.getDate()}`;

  const name   = S.g('pa2_name') || '';
  const suffix = name ? `, ${name}` : '';
  const greet  = h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening';
  document.getElementById('greetingEl').textContent = greet + suffix;
}
tick();
setInterval(tick, 1000);

// ── WEATHER ───────────────────────────────────────────────
const WMO = {
  0:['Clear','☀️'], 1:['Mostly clear','🌤️'], 2:['Partly cloudy','⛅'], 3:['Overcast','☁️'],
  45:['Foggy','🌫️'], 48:['Foggy','🌫️'],
  51:['Drizzle','🌦️'], 53:['Drizzle','🌦️'], 55:['Drizzle','🌧️'],
  61:['Rain','🌧️'],   63:['Rain','🌧️'],     65:['Heavy rain','🌧️'],
  71:['Snow','❄️'],   73:['Snow','❄️'],      75:['Heavy snow','❄️'],
  80:['Showers','🌦️'],81:['Showers','🌦️'],  82:['Showers','⛈️'],
  95:['Storm','⛈️'],  96:['Storm','⛈️'],     99:['Storm','⛈️'],
};

let wCache = null;

function drawWeather(tempC, code, city) {
  const [desc, icon] = WMO[code] || ['—','🌡️'];
  const tempF = Math.round(tempC * 9/5 + 32);
  const temp  = tUnit === 'C' ? `${Math.round(tempC)}°C` : `${tempF}°F`;
  wCache = { tempC, code, city };

  document.getElementById('weatherWrap').innerHTML = `
    <div class="weather-pill">
      <span class="weather-pill-icon">${icon}</span>
      <span class="weather-pill-temp">${temp}</span>
      <span class="weather-pill-desc">${desc}</span>
      <span class="weather-pill-loc">· ${city}</span>
      <div class="temp-toggle-btns">
        <button class="temp-toggle-btn ${tUnit==='C'?'on':''}" data-u="C">°C</button>
        <button class="temp-toggle-btn ${tUnit==='F'?'on':''}" data-u="F">°F</button>
      </div>
    </div>
  `;

  document.querySelectorAll('.temp-toggle-btn').forEach(b => {
    b.addEventListener('click', () => {
      tUnit = b.dataset.u;
      S.s('pa2_temp', tUnit);
      if (wCache) drawWeather(wCache.tempC, wCache.code, wCache.city);
    });
  });
}

(function initWeather() {
  if (!navigator.geolocation) {
    document.getElementById('weatherStatus').textContent = 'Location unavailable';
    return;
  }
  navigator.geolocation.getCurrentPosition(async pos => {
    const { latitude: lat, longitude: lon } = pos.coords;
    try {
      const [wr, gr] = await Promise.all([
        fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`),
        fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json`)
      ]);
      const wj = await wr.json();
      const gj = await gr.json();
      const city = gj.address?.city || gj.address?.town || gj.address?.village || 'Here';
      drawWeather(wj.current_weather.temperature, wj.current_weather.weathercode, city);
    } catch {
      document.getElementById('weatherStatus').textContent = 'Weather unavailable';
    }
  }, () => {
    document.getElementById('weatherStatus').textContent = 'Location denied';
  }, { timeout: 8000 });
})();

// ── UTILS ─────────────────────────────────────────────────
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
                  .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
let _toast;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(_toast); _toast = setTimeout(() => el.classList.remove('show'), 2400);
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,5); }

// ── TASKS ─────────────────────────────────────────────────
function renderTasks() {
  const done  = tasks.filter(t => t.done).length;
  const total = tasks.length;
  const pct   = total ? Math.round(done / total * 100) : 0;

  document.getElementById('progFill').style.width = pct + '%';
  document.getElementById('progLabel').textContent = `${done} of ${total} done`;
  document.getElementById('progPct').textContent   = pct + '%';
  document.getElementById('taskCount').textContent = tasks.filter(t => !t.done).length;

  const show = tFilter === 'all'  ? tasks
             : tFilter === 'done' ? tasks.filter(t => t.done)
             :                      tasks.filter(t => !t.done);

  const list = document.getElementById('taskList');
  if (!show.length) {
    list.innerHTML = `
      <div class="empty">
        <div class="empty-icon">${tFilter === 'done' ? '🎉' : '📋'}</div>
        ${tFilter === 'done' ? 'Nothing done yet' : 'No tasks here'}
      </div>`;
    return;
  }

  list.innerHTML = show.map(t => `
    <div class="task-item ${t.done ? 'done' : ''}" data-id="${esc(t.id)}">
      <label class="cb">
        <input type="checkbox" ${t.done ? 'checked' : ''} data-chk="${esc(t.id)}">
        <div class="cb-box"></div>
      </label>
      <span class="pri-dot p-${esc(t.pri)}"></span>
      <span class="task-text">${esc(t.text)}</span>
      <button class="del-btn" data-del="${esc(t.id)}" title="Delete">✕</button>
    </div>
  `).join('');

  list.querySelectorAll('[data-chk]').forEach(el =>
    el.addEventListener('change', () => toggleTask(el.dataset.chk)));
  list.querySelectorAll('[data-del]').forEach(el =>
    el.addEventListener('click', () => deleteTask(el.dataset.del)));
}

function addTask(text, pri) {
  text = (text || '').trim();
  if (!text) { toast('Enter a task first'); return false; }
  tasks.unshift({ id: uid(), text, pri: pri || 'med', done: false });
  save(); renderTasks(); return true;
}
function toggleTask(id) {
  const t = tasks.find(t => t.id === id);
  if (t) { t.done = !t.done; save(); renderTasks(); }
}
function deleteTask(id) {
  tasks = tasks.filter(t => t.id !== id);
  save(); renderTasks();
}

document.getElementById('taskAddBtn').addEventListener('click', () => {
  if (addTask(document.getElementById('taskInput').value, document.getElementById('priSel').value))
    document.getElementById('taskInput').value = '';
});
document.getElementById('taskInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('taskAddBtn').click();
});
document.getElementById('filterTabs').addEventListener('click', e => {
  const btn = e.target.closest('.filter-tab');
  if (!btn) return;
  tFilter = btn.dataset.f;
  document.querySelectorAll('.filter-tab').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  renderTasks();
});

// ── EVENTS ────────────────────────────────────────────────
function fmt(t) {
  const [h, m] = t.split(':').map(Number);
  return `${h % 12 || 12}:${String(m).padStart(2,'0')} ${h >= 12 ? 'PM' : 'AM'}`;
}

function renderEvents() {
  const list = document.getElementById('eventList');
  document.getElementById('evCount').textContent = events.length;

  if (!events.length) {
    list.innerHTML = `<div class="empty"><div class="empty-icon">📅</div>No events today</div>`;
    return;
  }

  const now  = new Date();
  const nowM = now.getHours() * 60 + now.getMinutes();
  const sorted = [...events].sort((a, b) => a.time.localeCompare(b.time));

  list.innerHTML = sorted.map(ev => {
    const [h, m] = ev.time.split(':').map(Number);
    const evM    = h * 60 + m;
    const past   = evM < nowM - 1;
    const near   = !past && Math.abs(evM - nowM) <= 30;
    return `
      <div class="event-item ${past ? 'past' : ''}">
        <span class="event-time-col">${fmt(ev.time)}</span>
        <span class="event-dot"></span>
        <span class="event-title">${esc(ev.title)}</span>
        ${near ? '<span class="now-tag">NOW</span>' : ''}
        <button class="del-btn" data-evdel="${esc(ev.id)}" title="Delete">✕</button>
      </div>
    `;
  }).join('');

  list.querySelectorAll('[data-evdel]').forEach(el =>
    el.addEventListener('click', () => deleteEvent(el.dataset.evdel)));
}

function addEvent(title, time) {
  title = (title || '').trim(); time = (time || '').trim();
  if (!title || !time) { toast('Enter title and time'); return false; }
  events.push({ id: uid(), title, time });
  save(); renderEvents(); return true;
}
function deleteEvent(id) {
  events = events.filter(e => e.id !== id);
  save(); renderEvents();
}

document.getElementById('evAddBtn').addEventListener('click', () => {
  if (addEvent(document.getElementById('evTitle').value, document.getElementById('evTime').value)) {
    document.getElementById('evTitle').value = '';
  }
});
document.getElementById('evTitle').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('evAddBtn').click();
});
document.getElementById('evTime').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('evAddBtn').click();
});
setInterval(renderEvents, 60000);

// ── COMMAND BAR ───────────────────────────────────────────
const CMDS = [
  { pfx: 'add task',  ex: 'add task call the client high', desc: 'Add a task  [high|med|low]' },
  { pfx: 'add event', ex: 'add event 3pm team meeting',    desc: 'Add a schedule event' },
  { pfx: 'note',      ex: 'note pick up dry cleaning',     desc: 'Quick note as a task' },
  { pfx: 'done',      ex: 'done',                          desc: 'Check off first active task' },
  { pfx: 'clear done',ex: 'clear done',                    desc: 'Remove completed tasks' },
];

const cmdInput = document.getElementById('cmdInput');
const sugBox   = document.getElementById('suggestions');

cmdInput.addEventListener('input', () => {
  const v = cmdInput.value.toLowerCase().trim();
  if (!v) { sugBox.classList.remove('open'); return; }
  const hits = CMDS.filter(c => c.pfx.startsWith(v) || v.startsWith(c.pfx.split(' ')[0]));
  if (!hits.length) { sugBox.classList.remove('open'); return; }
  sugBox.innerHTML = hits.map(c => `
    <div class="sug-item" data-ex="${esc(c.ex)}">
      <span class="sug-cmd">${esc(c.pfx)}</span>
      <span class="sug-desc">${esc(c.desc)}</span>
    </div>
  `).join('');
  sugBox.classList.add('open');
  sugBox.querySelectorAll('.sug-item').forEach(el =>
    el.addEventListener('click', () => {
      cmdInput.value = el.dataset.ex;
      cmdInput.focus();
      sugBox.classList.remove('open');
    }));
});

cmdInput.addEventListener('keydown', e => {
  if (e.key === 'Escape') { sugBox.classList.remove('open'); return; }
  if (e.key !== 'Enter') return;
  sugBox.classList.remove('open');
  const raw = cmdInput.value.trim();
  if (!raw) return;
  handleCmd(raw);
  cmdInput.value = '';
});

document.addEventListener('click', e => {
  if (!e.target.closest('.cmd-wrap')) sugBox.classList.remove('open');
});
document.addEventListener('keydown', e => {
  if (e.key === '/' && !['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)) {
    e.preventDefault(); cmdInput.focus();
  }
});

function parseTime(s) {
  const m = s.match(/^(\d{1,2})(?::?(\d{2}))?\s*(am|pm)?$/i);
  if (!m) return null;
  let [, h, mn, ap] = m;
  h = parseInt(h); mn = mn ? parseInt(mn) : 0;
  if (ap) { if (ap.toLowerCase() === 'pm' && h !== 12) h += 12; if (ap.toLowerCase() === 'am' && h === 12) h = 0; }
  if (h < 0 || h > 23 || mn < 0 || mn > 59) return null;
  return `${String(h).padStart(2,'0')}:${String(mn).padStart(2,'0')}`;
}

function handleCmd(raw) {
  const lo = raw.toLowerCase().trim();

  if (lo.startsWith('add task ')) {
    let text = raw.slice(9).trim(), pri = 'med';
    const pm = text.match(/\s+(high|med|low)$/i);
    if (pm) { pri = pm[1].toLowerCase(); text = text.slice(0, -pm[0].length).trim(); }
    if (addTask(text, pri)) toast('Task added ✓');
    return;
  }
  if (lo.startsWith('note ')) {
    if (addTask(raw.slice(5).trim(), 'low')) toast('Note saved ✓');
    return;
  }
  if (lo.startsWith('add event ')) {
    const parts = raw.slice(10).trim().split(/\s+/);
    const time  = parseTime(parts[0]);
    if (time) { if (addEvent(parts.slice(1).join(' '), time)) toast('Event added ✓'); }
    else toast('Try: add event 3pm team meeting');
    return;
  }
  if (lo === 'done') {
    const t = tasks.find(t => !t.done);
    if (t) { t.done = true; save(); renderTasks(); toast('Marked done ✓'); }
    else toast('No active tasks');
    return;
  }
  if (lo === 'clear done') {
    const n = tasks.filter(t => t.done).length;
    tasks = tasks.filter(t => !t.done);
    save(); renderTasks();
    toast(`Cleared ${n} task${n !== 1 ? 's' : ''}`);
    return;
  }
  if (addTask(raw, 'med')) toast('Task added ✓');
}

// ── INIT ──────────────────────────────────────────────────
renderTasks();
renderEvents();

const now = new Date();
document.getElementById('evTime').value =
  `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
</script>
</body>
