<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
button { border: none; cursor: pointer; font-family: inherit; }
input, select, textarea { border: none; outline: none; font-family: inherit; }
:root {
  --bg:       #080810;
  --card:     rgba(255,255,255,.042);
  --card-h:   rgba(255,255,255,.07);
  --brd:      rgba(255,255,255,.08);
  --brd-f:    rgba(140,100,255,.6);
  --t1:       rgba(255,255,255,.92);
  --t2:       rgba(255,255,255,.50);
  --t3:       rgba(255,255,255,.25);
  --accent:   #7c5ce4;
  --accent2:  #a892ff;
  --glow:     rgba(124,92,228,.35);
  --ok:       #2dd4bf;
  --warn:     #fbbf24;
  --danger:   #f87171;
  --font:     'Inter', sans-serif;
  --mono:     'JetBrains Mono', monospace;
  --rad:      14px;
  --tr:       180ms ease;
}
body {
  background: var(--bg);
  color: var(--t1);
  font-family: var(--font);
  min-height: 100vh;
  overflow-x: hidden;
}
body::before {
  content: '';
  position: fixed; inset: 0;
  background:
    radial-gradient(ellipse 65% 55% at 15% 15%, rgba(124,92,228,.13) 0%, transparent 60%),
    radial-gradient(ellipse 45% 45% at 85% 85%, rgba(45,212,191,.07) 0%, transparent 60%);
  pointer-events: none; z-index: 0;
}
body::after {
  content: '';
  position: fixed; inset: 0;
  background-image:
    linear-gradient(rgba(255,255,255,.018) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.018) 1px, transparent 1px);
  background-size: 44px 44px;
  pointer-events: none; z-index: 0;
}
.app {
  position: relative; z-index: 1;
  max-width: 1160px;
  margin: 0 auto;
  padding: 1.75rem 1.5rem 3rem;
  display: flex;
  flex-direction: column;
  gap: 1.5rem;
}
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  flex-wrap: wrap;
}
.brand { display: flex; align-items: center; gap: .75rem; }
.brand-dot {
  width: 10px; height: 10px;
  background: var(--accent2);
  border-radius: 50%;
  box-shadow: 0 0 12px var(--accent2);
  animation: pulse 2.5s ease-in-out infinite;
}
@keyframes pulse {
  0%,100% { box-shadow: 0 0 8px var(--accent2); }
  50%      { box-shadow: 0 0 20px var(--accent2), 0 0 36px var(--glow); }
}
.brand-name {
  font-size: .72rem;
  letter-spacing: 3px;
  color: var(--t2);
  text-transform: uppercase;
  font-weight: 500;
}
.topbar-right { display: flex; align-items: center; gap: .75rem; }
.name-badge {
  display: flex;
  align-items: center;
  gap: .5rem;
  background: var(--card);
  border: 1px solid var(--brd);
  border-radius: 30px;
  padding: .35rem .75rem .35rem .5rem;
}
.name-badge-icon { font-size: .9rem; }
.name-input-inline {
  background: transparent;
  color: var(--t1);
  font-size: .75rem;
  font-weight: 500;
  width: 100px;
}
.name-input-inline::placeholder { color: var(--t3); }
.hero-row {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 1.5rem;
  align-items: center;
}
.clock-time {
  font-family: var(--mono);
  font-size: clamp(3rem, 8vw, 5rem);
  font-weight: 400;
  line-height: 1;
  letter-spacing: -2px;
  color: var(--t1);
  display: inline-flex;
  align-items: baseline;
  gap: .3rem;
}
.clock-ampm { font-size: 1.1rem; letter-spacing: 1px; color: var(--t3); }
.clock-date { margin-top: .45rem; font-size: .72rem; color: var(--t2); letter-spacing: 1.5px; text-transform: uppercase; }
.clock-greeting { margin-top: .65rem; font-size: 1.55rem; font-weight: 600; color: var(--accent2); }
.weather-card {
  background: var(--card);
  border: 1px solid var(--brd);
  border-radius: var(--rad);
  padding: 1.25rem 1.5rem;
  min-width: 190px;
  text-align: right;
  backdrop-filter: blur(14px);
}
.weather-main { display: flex; align-items: center; justify-content: flex-end; gap: .75rem; }
.weather-icon { font-size: 2.4rem; }
.weather-temp { font-size: 2.2rem; font-weight: 300; line-height: 1; }
.weather-temp sup { font-size: .85rem; color: var(--t2); }
.weather-desc { margin-top: .4rem; font-size: .67rem; letter-spacing: 1.5px; color: var(--t2); text-transform: uppercase; }
.weather-loc { margin-top: .25rem; font-size: .63rem; color: var(--t3); }
.weather-hint { font-size: .7rem; color: var(--t3); font-family: var(--mono); }
.temp-toggle { margin-top: .5rem; display: flex; gap: .35rem; justify-content: flex-end; }
.temp-btn {
  font-size: .62rem; padding: 2px 8px; border-radius: 20px;
  background: transparent; border: 1px solid var(--brd); color: var(--t3);
  cursor: pointer; transition: all var(--tr);
}
.temp-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.cmd-wrap { position: relative; }
.cmd-bar {
  display: flex; align-items: center; gap: .75rem;
  background: var(--card); border: 1px solid var(--brd); border-radius: var(--rad);
  padding: .9rem 1.25rem; backdrop-filter: blur(14px);
  transition: border-color var(--tr), box-shadow var(--tr);
}
.cmd-bar:focus-within { border-color: var(--brd-f); box-shadow: 0 0 0 1px var(--brd-f), 0 6px 30px var(--glow); }
.cmd-prompt { font-family: var(--mono); font-size: .85rem; color: var(--accent2); flex-shrink: 0; user-select: none; }
.cmd-input { flex: 1; background: transparent; color: var(--t1); font-family: var(--mono); font-size: .8rem; letter-spacing: .2px; }
.cmd-input::placeholder { color: var(--t3); }
.cmd-enter { font-size: .65rem; letter-spacing: 1px; color: var(--t3); flex-shrink: 0; font-family: var(--mono); }
.suggestions {
  position: absolute; top: calc(100% + .5rem); left: 0; right: 0;
  background: rgba(12,12,20,.96); border: 1px solid var(--brd); border-radius: var(--rad);
  backdrop-filter: blur(20px); box-shadow: 0 12px 40px rgba(0,0,0,.6);
  overflow: hidden; z-index: 50; display: none;
}
.suggestions.open { display: block; }
.sug-item {
  display: flex; align-items: center; gap: .75rem;
  padding: .7rem 1rem; border-bottom: 1px solid var(--brd);
  cursor: pointer; transition: background var(--tr);
}
.sug-item:last-child { border-bottom: none; }
.sug-item:hover { background: rgba(124,92,228,.18); }
.sug-cmd { font-family: var(--mono); font-size: .72rem; color: var(--accent2); min-width: 100px; }
.sug-desc { font-size: .72rem; color: var(--t2); }
.main-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; align-items: start; }
.card { background: var(--card); border: 1px solid var(--brd); border-radius: var(--rad); padding: 1.5rem; backdrop-filter: blur(14px); }
.card-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.25rem; }
.card-title { font-size: .62rem; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; color: var(--t3); }
.card-badge { font-family: var(--mono); font-size: .68rem; color: var(--accent2); background: rgba(124,92,228,.15); padding: 2px 9px; border-radius: 20px; }
.filters { display: flex; gap: .4rem; margin-bottom: .9rem; }
.filter-btn {
  padding: .28rem .7rem; border-radius: 20px; font-size: .68rem; font-weight: 500;
  color: var(--t2); background: transparent; border: 1px solid var(--brd);
  cursor: pointer; transition: all var(--tr);
}
.filter-btn.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.progress-wrap { margin-bottom: 1rem; }
.progress-bar { height: 2.5px; background: rgba(255,255,255,.07); border-radius: 2px; overflow: hidden; }
.progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--ok)); border-radius: 2px; transition: width .4s ease; }
.progress-meta { display: flex; justify-content: space-between; margin-top: .4rem; }
.progress-meta span { font-size: .6rem; color: var(--t3); font-family: var(--mono); }
.add-row { display: flex; gap: .5rem; margin-bottom: 1rem; flex-wrap: wrap; }
.add-input {
  flex: 1; min-width: 120px;
  background: rgba(255,255,255,.04); border: 1px solid var(--brd); border-radius: 10px;
  padding: .58rem .9rem; color: var(--t1); font-size: .78rem; transition: border-color var(--tr);
}
.add-input:focus { border-color: var(--brd-f); }
.add-input::placeholder { color: var(--t3); }
.add-input.sm { width: 82px; flex: none; min-width: unset; }
.priority-sel {
  background: rgba(255,255,255,.04); border: 1px solid var(--brd); border-radius: 10px;
  padding: .58rem .55rem; color: var(--t2); font-size: .75rem; cursor: pointer; width: 68px; flex-shrink: 0;
}
.priority-sel option { background: #12121e; }
.add-btn {
  background: var(--accent); color: #fff; border-radius: 10px;
  padding: .58rem 1rem; font-size: .76rem; font-weight: 600;
  transition: background var(--tr), box-shadow var(--tr); white-space: nowrap; flex-shrink: 0;
}
.add-btn:hover { background: #9070f0; box-shadow: 0 4px 18px var(--glow); }
.task-item {
  display: flex; align-items: flex-start; gap: .7rem;
  padding: .7rem 0; border-bottom: 1px solid var(--brd); animation: slideIn .2s ease;
}
.task-item:last-child { border-bottom: none; }
@keyframes slideIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
.task-check {
  width: 17px; height: 17px; border: 1.5px solid rgba(255,255,255,.2); border-radius: 5px;
  flex-shrink: 0; margin-top: 2px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: .6rem; color: transparent; transition: all var(--tr);
}
.task-item.done .task-check { background: var(--ok); border-color: var(--ok); color: #fff; }
.task-item.done .task-label { text-decoration: line-through; color: var(--t3); }
.task-label { flex: 1; font-size: .83rem; line-height: 1.4; transition: color var(--tr); }
.task-dot { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; margin-top: 6px; }
.p-high { background: var(--danger); }
.p-med  { background: var(--warn); }
.p-low  { background: var(--ok); }
.icon-btn {
  color: var(--t3); font-size: .72rem; padding: 2px 5px; border-radius: 5px;
  background: transparent; transition: color var(--tr), background var(--tr); flex-shrink: 0;
}
.icon-btn:hover { color: var(--danger); background: rgba(248,113,113,.1); }
.event-item {
  display: flex; gap: .9rem; padding: .7rem 0;
  border-bottom: 1px solid var(--brd); animation: slideIn .2s ease;
}
.event-item:last-child { border-bottom: none; }
.event-bar { width: 3px; background: var(--accent); border-radius: 2px; flex-shrink: 0; opacity: .65; align-self: stretch; min-height: 20px; }
.event-time { font-family: var(--mono); font-size: .7rem; color: var(--accent2); width: 52px; flex-shrink: 0; padding-top: 1px; }
.event-title { flex: 1; font-size: .83rem; line-height: 1.35; }
.past { opacity: .4; }
.now-indicator {
  font-size: .6rem; font-family: var(--mono); color: var(--ok);
  padding: 1px 6px; border-radius: 10px; background: rgba(45,212,191,.12);
  white-space: nowrap; flex-shrink: 0; align-self: flex-start;
}
.empty { text-align: center; padding: 2.25rem 1rem; font-family: var(--mono); font-size: .72rem; color: var(--t3); }
.toast {
  position: fixed; bottom: 2rem; left: 50%;
  transform: translateX(-50%) translateY(12px);
  background: rgba(124,92,228,.92); color: #fff;
  padding: .6rem 1.4rem; border-radius: 30px;
  font-size: .78rem; font-family: var(--mono);
  backdrop-filter: blur(14px); opacity: 0; pointer-events: none;
  z-index: 200; white-space: nowrap; transition: opacity .25s ease, transform .25s ease;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
@media (max-width: 720px) {
  .hero-row { grid-template-columns: 1fr; }
  .weather-card { text-align: left; }
  .weather-main { justify-content: flex-start; }
  .temp-toggle { justify-content: flex-start; }
  .main-grid { grid-template-columns: 1fr; }
  .clock-time { font-size: 3rem; }
}
@media (max-width: 400px) {
  .app { padding: 1rem; }
  .add-row { flex-direction: column; }
  .add-input.sm, .priority-sel { width: 100%; }
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="brand-dot"></div>
      <span class="brand-name">My Assistant</span>
    </div>
    <div class="topbar-right">
      <div class="name-badge">
        <span class="name-badge-icon">👤</span>
        <input class="name-input-inline" id="nameInput" type="text" placeholder="Your name" maxlength="20">
      </div>
    </div>
  </header>
  <div class="hero-row">
    <div class="clock-block">
      <div class="clock-time" id="clockEl"></div>
      <div class="clock-date" id="dateEl"></div>
      <div class="clock-greeting" id="greetingEl"></div>
    </div>
    <div class="weather-card" id="weatherCard">
      <div class="weather-hint" id="weatherStatus">Fetching weather…</div>
    </div>
  </div>
  <div class="cmd-wrap">
    <div class="cmd-bar">
      <span class="cmd-prompt">&gt;_</span>
      <input class="cmd-input" id="cmdInput" type="text"
        placeholder="add task review designs  ·  add event 3pm standup  ·  note buy milk">
      <span class="cmd-enter">↵</span>
    </div>
    <div class="suggestions" id="suggestions"></div>
  </div>
  <div class="main-grid">
    <div class="card">
      <div class="card-head">
        <span class="card-title">Tasks</span>
        <span class="card-badge" id="taskBadge">0</span>
      </div>
      <div class="filters" id="taskFilters">
        <button class="filter-btn on" data-f="all">All</button>
        <button class="filter-btn" data-f="active">Active</button>
        <button class="filter-btn" data-f="done">Done</button>
      </div>
      <div class="progress-wrap">
        <div class="progress-bar">
          <div class="progress-fill" id="taskFill" style="width:0%"></div>
        </div>
        <div class="progress-meta">
          <span id="taskMeta">0 of 0 done</span>
          <span id="taskPct">0%</span>
        </div>
      </div>
      <div class="add-row">
        <input class="add-input" id="taskInput" type="text" placeholder="New task…">
        <select class="priority-sel" id="priSel">
          <option value="med">Med</option>
          <option value="high">High</option>
          <option value="low">Low</option>
        </select>
        <button class="add-btn" id="taskAddBtn">+ Add</button>
      </div>
      <div id="taskList"></div>
    </div>
    <div class="card">
      <div class="card-head">
        <span class="card-title">Today's Schedule</span>
        <span class="card-badge" id="eventBadge">0</span>
      </div>
      <div class="add-row">
        <input class="add-input" id="evTitle" type="text" placeholder="Event title…">
        <input class="add-input sm" id="evTime" type="time">
        <button class="add-btn" id="evAddBtn">+ Add</button>
      </div>
      <div id="eventList"></div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
'use strict';
const LS = {
  get: k => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set: (k, v) => localStorage.setItem(k, JSON.stringify(v)),
};
let tasks  = LS.get('pa_tasks')  || [];
let events = LS.get('pa_events') || [];
let tempUnit = LS.get('pa_temp') || 'C';
let taskFilter = 'all';
function persist() { LS.set('pa_tasks', tasks); LS.set('pa_events', events); }
const clockEl = document.getElementById('clockEl');
const dateEl = document.getElementById('dateEl');
const greetingEl = document.getElementById('greetingEl');
const nameInput = document.getElementById('nameInput');
const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
function updateClock() {
  const n = new Date();
  let h = n.getHours();
  const m = String(n.getMinutes()).padStart(2,'0');
  const ap = h >= 12 ? 'PM' : 'AM';
  const h12 = h % 12 || 12;
  clockEl.innerHTML = `${h12}:${m}<span class="clock-ampm">${ap}</span>`;
  dateEl.textContent = `${DAYS[n.getDay()]}, ${MONTHS[n.getMonth()]} ${n.getDate()}, ${n.getFullYear()}`;
  const name = nameInput.value.trim();
  const suffix = name ? `, ${name}` : '';
  greetingEl.textContent = h < 12 ? `Good morning${suffix}` : h < 17 ? `Good afternoon${suffix}` : `Good evening${suffix}`;
}
updateClock();
setInterval(updateClock, 1000);
nameInput.value = LS.get('pa_name') || '';
nameInput.addEventListener('input', () => { LS.set('pa_name', nameInput.value.trim()); updateClock(); });
const WMO = {
  0:['Clear sky','☀️'], 1:['Mainly clear','🌤️'], 2:['Partly cloudy','⛅'], 3:['Overcast','☁️'],
  45:['Foggy','🌫️'], 48:['Foggy','🌫️'],
  51:['Light drizzle','🌦️'], 53:['Drizzle','🌦️'], 55:['Heavy drizzle','🌧️'],
  61:['Light rain','🌦️'], 63:['Rain','🌧️'], 65:['Heavy rain','🌧️'],
  71:['Light snow','🌨️'], 73:['Snow','❄️'], 75:['Heavy snow','❄️'],
  80:['Showers','🌦️'], 81:['Showers','🌦️'], 82:['Heavy showers','⛈️'],
  95:['Thunderstorm','⛈️'], 96:['Thunderstorm','⛈️'], 99:['Thunderstorm','⛈️'],
};
let weatherData = null;
function renderWeather(data, city) {
  const cw = data.current_weather;
  const [desc, icon] = WMO[cw.weathercode] || ['Unknown','🌡️'];
  const tempC = Math.round(cw.temperature);
  const tempF = Math.round(tempC * 9/5 + 32);
  const display = tempUnit === 'C' ? `${tempC}<sup>°C</sup>` : `${tempF}<sup>°F</sup>`;
  weatherData = { tempC, tempF, desc, icon, city };
  document.getElementById('weatherCard').innerHTML = `
    <div class="weather-main">
      <span class="weather-icon">${icon}</span>
      <span class="weather-temp">${display}</span>
    </div>
    <div class="weather-desc">${desc}</div>
    <div class="weather-loc">📍 ${city}</div>
    <div class="temp-toggle">
      <button class="temp-btn ${tempUnit==='C'?'active':''}" data-u="C">°C</button>
      <button class="temp-btn ${tempUnit==='F'?'active':''}" data-u="F">°F</button>
    </div>
  `;
  document.querySelectorAll('.temp-btn').forEach(b => {
    b.addEventListener('click', () => {
      tempUnit = b.dataset.u;
      LS.set('pa_temp', tempUnit);
      if (weatherData) renderWeather({ current_weather: { temperature: weatherData.tempC, weathercode: 0 } }, weatherData.city);
    });
  });
}
function initWeather() {
  const status = document.getElementById('weatherStatus');
  if (!navigator.geolocation) { status.textContent = 'Location unavailable'; return; }
  navigator.geolocation.getCurrentPosition(async pos => {
    const { latitude: lat, longitude: lon } = pos.coords;
    try {
      const [wr, gr] = await Promise.all([
        fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&temperature_unit=celsius`),
        fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json`)
      ]);
      const wj = await wr.json();
      const gj = await gr.json();
      const city = gj.address?.city || gj.address?.town || gj.address?.village || 'Your location';
      renderWeather(wj, city);
    } catch { status.textContent = 'Weather unavailable'; }
  }, () => { status.textContent = 'Allow location for weather'; }, { timeout: 8000 });
}
initWeather();
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
let _tid;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(_tid); _tid = setTimeout(() => el.classList.remove('show'), 2600);
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,5); }
function renderTasks() {
  const list = document.getElementById('taskList');
  const done = tasks.filter(t => t.done).length;
  const total = tasks.length;
  const pct = total ? Math.round(done / total * 100) : 0;
  document.getElementById('taskFill').style.width = pct + '%';
  document.getElementById('taskMeta').textContent = `${done} of ${total} done`;
  document.getElementById('taskPct').textContent = pct + '%';
  document.getElementById('taskBadge').textContent = tasks.filter(t => !t.done).length;
  const show = taskFilter === 'all' ? tasks : taskFilter === 'done' ? tasks.filter(t => t.done) : tasks.filter(t => !t.done);
  if (!show.length) { list.innerHTML = `<div class="empty">// nothing here //</div>`; return; }
  list.innerHTML = show.map(t => `
    <div class="task-item ${t.done ? 'done' : ''}">
      <div class="task-check" data-id="${esc(t.id)}">${t.done ? '✓' : ''}</div>
      <span class="task-dot p-${esc(t.pri)}"></span>
      <span class="task-label">${esc(t.text)}</span>
      <button class="icon-btn" data-del="${esc(t.id)}" title="Delete">✕</button>
    </div>
  `).join('');
  list.querySelectorAll('.task-check').forEach(el => el.addEventListener('click', () => toggleTask(el.dataset.id)));
  list.querySelectorAll('[data-del]').forEach(el => el.addEventListener('click', () => deleteTask(el.dataset.del)));
}
function addTask(text, pri) {
  text = (text || '').trim();
  if (!text) { toast('Enter a task first'); return; }
  tasks.unshift({ id: uid(), text, pri: pri || 'med', done: false, ts: Date.now() });
  persist(); renderTasks();
}
function toggleTask(id) { const t = tasks.find(t => t.id === id); if (t) { t.done = !t.done; persist(); renderTasks(); } }
function deleteTask(id) { tasks = tasks.filter(t => t.id !== id); persist(); renderTasks(); }
document.getElementById('taskAddBtn').addEventListener('click', () => {
  const text = document.getElementById('taskInput').value;
  const pri = document.getElementById('priSel').value;
  addTask(text, pri);
  document.getElementById('taskInput').value = '';
});
document.getElementById('taskInput').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('taskAddBtn').click(); });
document.getElementById('taskFilters').addEventListener('click', e => {
  const btn = e.target.closest('.filter-btn');
  if (!btn) return;
  taskFilter = btn.dataset.f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('on'));
  btn.classList.add('on'); renderTasks();
});
function fmt12(time24) {
  const [h, m] = time24.split(':').map(Number);
  const ap = h >= 12 ? 'PM' : 'AM';
  return `${h % 12 || 12}:${String(m).padStart(2,'0')} ${ap}`;
}
function renderEvents() {
  const list = document.getElementById('eventList');
  document.getElementById('eventBadge').textContent = events.length;
  if (!events.length) { list.innerHTML = `<div class="empty">// no events today //</div>`; return; }
  const now = new Date();
  const nowM = now.getHours() * 60 + now.getMinutes();
  const sorted = [...events].sort((a, b) => a.time.localeCompare(b.time));
  list.innerHTML = sorted.map(ev => {
    const [h, m] = ev.time.split(':').map(Number);
    const evM = h * 60 + m;
    const past = evM < nowM - 1;
    const current = Math.abs(evM - nowM) <= 30;
    return `
      <div class="event-item ${past ? 'past' : ''}">
        <div class="event-bar"></div>
        <span class="event-time">${fmt12(ev.time)}</span>
        <span class="event-title">${esc(ev.title)}</span>
        ${current && !past ? '<span class="now-indicator">NOW</span>' : ''}
        <button class="icon-btn" data-evdel="${esc(ev.id)}" title="Delete">✕</button>
      </div>
    `;
  }).join('');
  list.querySelectorAll('[data-evdel]').forEach(el => el.addEventListener('click', () => deleteEvent(el.dataset.evdel)));
}
function addEvent(title, time) {
  title = (title || '').trim(); time = (time || '').trim();
  if (!title || !time) { toast('Enter both a title and time'); return; }
  events.push({ id: uid(), title, time }); persist(); renderEvents();
}
function deleteEvent(id) { events = events.filter(e => e.id !== id); persist(); renderEvents(); }
document.getElementById('evAddBtn').addEventListener('click', () => {
  const title = document.getElementById('evTitle').value;
  const time = document.getElementById('evTime').value;
  addEvent(title, time);
  document.getElementById('evTitle').value = '';
  document.getElementById('evTime').value = '';
});
document.getElementById('evTitle').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('evAddBtn').click(); });
document.getElementById('evTime').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('evAddBtn').click(); });
setInterval(renderEvents, 60000);
const CMDS = [
  { pfx: 'add task', ex: 'add task review designs high', desc: 'Add a task  [high|med|low]' },
  { pfx: 'add event', ex: 'add event 3pm team standup', desc: 'Add an event  <time> <title>' },
  { pfx: 'note', ex: 'note call the dentist', desc: 'Save a quick note as a task' },
  { pfx: 'done', ex: 'done', desc: 'Mark first active task done' },
  { pfx: 'clear done', ex: 'clear done', desc: 'Remove completed tasks' },
  { pfx: 'help', ex: 'help', desc: 'Show all commands' },
];
const cmdInput = document.getElementById('cmdInput');
const sugBox = document.getElementById('suggestions');
cmdInput.addEventListener('input', () => {
  const v = cmdInput.value.toLowerCase().trim();
  if (!v) { sugBox.classList.remove('open'); return; }
  const matches = CMDS.filter(c => c.pfx.startsWith(v) || v.startsWith(c.pfx.split(' ')[0]));
  if (!matches.length) { sugBox.classList.remove('open'); return; }
  sugBox.innerHTML = matches.map(c => `<div class="sug-item" data-ex="${esc(c.ex)}"><span class="sug-cmd">${esc(c.pfx)}</span><span class="sug-desc">${esc(c.desc)}</span></div>`).join('');
  sugBox.classList.add('open');
  sugBox.querySelectorAll('.sug-item').forEach(el => el.addEventListener('click', () => { cmdInput.value = el.dataset.ex; cmdInput.focus(); sugBox.classList.remove('open'); }));
});
cmdInput.addEventListener('keydown', e => {
  if (e.key === 'Escape') { sugBox.classList.remove('open'); return; }
  if (e.key !== 'Enter') return;
  sugBox.classList.remove('open');
  const raw = cmdInput.value.trim();
  if (!raw) return;
  handleCmd(raw); cmdInput.value = '';
});
document.addEventListener('click', e => { if (!e.target.closest('.cmd-wrap')) sugBox.classList.remove('open'); });
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') {
    e.preventDefault(); cmdInput.focus();
  }
});
function parseTime(str) {
  const m = str.match(/^(\d{1,2})(?::?(\d{2}))?\s*(am|pm)?$/i);
  if (!m) return null;
  let [, hr, mn, ap] = m;
  hr = parseInt(hr); mn = mn ? parseInt(mn) : 0;
  if (ap) { if (ap.toLowerCase() === 'pm' && hr !== 12) hr += 12; if (ap.toLowerCase() === 'am' && hr === 12) hr = 0; }
  if (hr < 0 || hr > 23 || mn < 0 || mn > 59) return null;
  return `${String(hr).padStart(2,'0')}:${String(mn).padStart(2,'0')}`;
}
function handleCmd(raw) {
  const lower = raw.toLowerCase().trim();
  if (lower.startsWith('add task ')) {
    let text = raw.slice(9).trim(); let pri = 'med';
    const pm = text.match(/\s+(high|med|low)$/i);
    if (pm) { pri = pm[1].toLowerCase(); text = text.slice(0, -pm[0].length).trim(); }
    addTask(text, pri); renderTasks(); toast('Task added'); return;
  }
  if (lower.startsWith('note ')) { addTask(raw.slice(5).trim(), 'low'); renderTasks(); toast('Note saved as task'); return; }
  if (lower.startsWith('add event ')) {
    const rest = raw.slice(10).trim();
    const parts = rest.split(/\s+/);
    const time = parseTime(parts[0]);
    if (time) { addEvent(parts.slice(1).join(' '), time); renderEvents(); toast('Event added'); }
    else toast('Try: add event 3pm team standup');
    return;
  }
  if (lower === 'done') { const first = tasks.find(t => !t.done); if (first) { first.done = true; persist(); renderTasks(); toast('Marked done'); } else toast('No active tasks'); return; }
  if (lower === 'clear done') { const n = tasks.filter(t => t.done).length; tasks = tasks.filter(t => !t.done); persist(); renderTasks(); toast(`Cleared ${n} completed task${n !== 1 ? 's' : ''}`); return; }
  if (lower === 'help') { toast('Commands: add task · add event · note · done · clear done'); return; }
  addTask(raw, 'med'); renderTasks(); toast('Task added');
}
renderTasks();
renderEvents();
const now = new Date();
document.getElementById('evTime').value = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
</script>
</body>
