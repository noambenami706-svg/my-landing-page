<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#F2F2F7">
<title>My Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;height:100%}
body{height:100%;overflow-x:hidden;-webkit-font-smoothing:antialiased}
button{border:none;background:none;cursor:pointer;font-family:inherit}
input,select,textarea{border:none;outline:none;font-family:inherit;appearance:none;-webkit-appearance:none}
:root{
--sys-bg:#F2F2F7;--sys-bg2:#FFFFFF;--sys-bg3:#E5E5EA;--sys-sep:rgba(60,60,67,.18);
--label-1:#000000;--label-2:rgba(60,60,67,.60);--label-3:rgba(60,60,67,.30);--label-4:rgba(60,60,67,.18);
--blue:#007AFF;--blue-light:rgba(0,122,255,.10);
--green:#34C759;--green-light:rgba(52,199,89,.12);
--red:#FF3B30;--red-light:rgba(255,59,48,.10);
--orange:#FF9500;--orange-light:rgba(255,149,0,.12);
--text-xs:11px;--text-sm:13px;--text-body:17px;--text-md:20px;--text-lg:28px;--text-xl:34px;
--sp1:4px;--sp2:8px;--sp3:12px;--sp4:16px;--sp5:20px;--sp6:24px;
--r-sm:8px;--r-md:12px;--r-lg:16px;--r-xl:22px;--r-full:999px;
--shadow-card:0 1px 0 rgba(0,0,0,.04),0 2px 8px rgba(0,0,0,.06);
--shadow-fab:0 4px 16px rgba(0,0,0,.18),0 2px 4px rgba(0,0,0,.10);
--shadow-sheet:0 -4px 32px rgba(0,0,0,.12);
--ease-spring:cubic-bezier(.34,1.56,.64,1);--ease-smooth:cubic-bezier(.4,0,.2,1);
--dur-fast:140ms;--dur-mid:220ms;--dur-slow:360ms;--hit:44px;
}
body{background:var(--sys-bg);color:var(--label-1);font-family:'Inter',system-ui,sans-serif;font-size:var(--text-body);min-height:100dvh;}
.app{max-width:430px;margin:0 auto;min-height:100dvh;position:relative;padding-bottom:120px;}
.hero{padding:var(--sp6) var(--sp5) var(--sp5);background:var(--sys-bg2);border-bottom:1px solid var(--sys-sep);}
.hero-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:var(--sp5);}
.hero-greeting{font-size:var(--text-xl);font-weight:800;letter-spacing:-.8px;line-height:1.10;color:var(--label-1);}
.hero-date{margin-top:var(--sp1);font-size:var(--text-sm);font-weight:500;color:var(--label-2);}
.hero-clock{font-size:var(--text-md);font-weight:700;color:var(--label-1);background:var(--sys-bg);border-radius:var(--r-md);padding:var(--sp2) var(--sp3);min-width:76px;text-align:center;letter-spacing:-.3px;}
.weather-bar{display:flex;align-items:center;gap:var(--sp2);background:var(--sys-bg);border-radius:var(--r-md);padding:var(--sp3) var(--sp4);}
.weather-icon{font-size:22px;line-height:1}
.weather-info{flex:1}
.weather-temp{font-size:var(--text-sm);font-weight:700;color:var(--label-1);}
.weather-desc{font-size:var(--text-xs);color:var(--label-2);}
.weather-loc{font-size:var(--text-xs);color:var(--label-3);}
.weather-loading{font-size:var(--text-sm);color:var(--label-3);padding:var(--sp3) var(--sp4);background:var(--sys-bg);border-radius:var(--r-md);font-weight:500;}
.temp-btns{display:flex;gap:4px;margin-left:auto}
.temp-btn{font-size:10px;font-weight:700;padding:3px 7px;border-radius:6px;color:var(--label-3);transition:all var(--dur-fast);min-height:28px;min-width:28px;display:flex;align-items:center;justify-content:center;}
.temp-btn.on{background:var(--blue);color:#fff}
.tab-bar{display:flex;background:var(--sys-bg2);padding:var(--sp2) var(--sp5);gap:var(--sp2);border-bottom:1px solid var(--sys-sep);position:sticky;top:0;z-index:10;}
.tab{flex:1;height:var(--hit);border-radius:var(--r-md);font-size:var(--text-sm);font-weight:600;color:var(--label-2);transition:all var(--dur-fast);display:flex;align-items:center;justify-content:center;gap:6px;}
.tab.on{background:var(--blue-light);color:var(--blue);}
.tab-badge{font-size:10px;font-weight:700;background:var(--blue);color:#fff;border-radius:var(--r-full);padding:1px 6px;min-width:18px;text-align:center;}
.tab:not(.on) .tab-badge{background:var(--label-3)}
.panels{padding:var(--sp4) var(--sp5)}
.panel{display:none}.panel.on{display:block}
.progress-header{display:flex;align-items:center;gap:var(--sp4);background:var(--sys-bg2);border-radius:var(--r-lg);padding:var(--sp4);margin-bottom:var(--sp3);box-shadow:var(--shadow-card);}
.ring-wrap{position:relative;width:52px;height:52px;flex-shrink:0}
.ring-svg{transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:var(--sys-bg3);stroke-width:5}
.ring-fill{fill:none;stroke:var(--green);stroke-width:5;stroke-linecap:round;stroke-dasharray:138.2;stroke-dashoffset:138.2;transition:stroke-dashoffset var(--dur-slow) var(--ease-smooth);}
.ring-pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--label-1);}
.progress-title{font-size:var(--text-sm);font-weight:700;color:var(--label-1);}
.progress-sub{font-size:var(--text-xs);color:var(--label-2);margin-top:2px;}
.filter-row{display:flex;gap:var(--sp2);margin-bottom:var(--sp3);overflow-x:auto;-ms-overflow-style:none;scrollbar-width:none;}
.filter-row::-webkit-scrollbar{display:none}
.filter-pill{flex-shrink:0;height:var(--hit);padding:0 var(--sp4);border-radius:var(--r-full);font-size:var(--text-sm);font-weight:600;color:var(--label-2);background:var(--sys-bg2);border:1.5px solid var(--sys-sep);transition:all var(--dur-fast);display:flex;align-items:center;}
.filter-pill.on{background:var(--label-1);color:#fff;border-color:var(--label-1);}
.task-group{background:var(--sys-bg2);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow-card);}
.task-item{display:flex;align-items:center;gap:var(--sp3);padding:var(--sp3) var(--sp4);min-height:var(--hit);border-bottom:1px solid var(--sys-sep);animation:slideIn var(--dur-mid) var(--ease-smooth);}
.task-item:last-child{border-bottom:none}
.task-item:active{background:var(--sys-bg)}
@keyframes slideIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.cb{position:relative;width:24px;height:24px;flex-shrink:0;}
.cb input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;z-index:1;margin:0;}
.cb-visual{position:absolute;inset:0;border:2px solid var(--label-3);border-radius:7px;background:var(--sys-bg2);transition:all var(--dur-fast) var(--ease-smooth);display:flex;align-items:center;justify-content:center;}
.cb-visual svg{opacity:0;transform:scale(.5);transition:all var(--dur-fast) var(--ease-spring);}
.cb input:checked~.cb-visual{background:var(--green);border-color:var(--green);}
.cb input:checked~.cb-visual svg{opacity:1;transform:scale(1);}
.cb input:focus-visible~.cb-visual{box-shadow:0 0 0 3px rgba(52,199,89,.35);}
.task-body{flex:1;min-width:0}
.task-text{font-size:var(--text-body);font-weight:500;color:var(--label-1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color var(--dur-fast);}
.task-item.done .task-text{color:var(--label-3);text-decoration:line-through;}
.task-meta{display:flex;align-items:center;gap:var(--sp2);margin-top:2px}
.pri-tag{font-size:10px;font-weight:700;border-radius:5px;padding:1px 6px;text-transform:uppercase;letter-spacing:.4px;}
.pri-tag.high{color:var(--red);background:var(--red-light)}
.pri-tag.med{color:var(--orange);background:var(--orange-light)}
.pri-tag.low{color:var(--green);background:var(--green-light)}
.del-hit{width:var(--hit);height:var(--hit);display:flex;align-items:center;justify-content:center;flex-shrink:0;border-radius:var(--r-md);color:var(--label-3);transition:color var(--dur-fast),background var(--dur-fast);}
.del-hit:active{color:var(--red);background:var(--red-light)}
.empty{text-align:center;padding:var(--sp6) var(--sp5) calc(var(--sp6)*2);}
.empty-emoji{font-size:40px;margin-bottom:var(--sp3)}
.empty-title{font-size:var(--text-md);font-weight:700;color:var(--label-1);margin-bottom:var(--sp2)}
.empty-sub{font-size:var(--text-sm);color:var(--label-2);max-width:240px;margin:0 auto;}
.timeline{background:var(--sys-bg2);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow-card);}
.ev-item{display:flex;align-items:stretch;min-height:var(--hit);border-bottom:1px solid var(--sys-sep);animation:slideIn var(--dur-mid) var(--ease-smooth);}
.ev-item:last-child{border-bottom:none}
.ev-time-col{width:72px;flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;padding:var(--sp3) var(--sp3) var(--sp3) var(--sp4);font-size:12px;font-weight:700;color:var(--blue);line-height:1.2;text-align:right;}
.ev-time-ampm{font-weight:500;color:var(--label-3);font-size:10px}
.ev-line-col{width:24px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.ev-dot{width:10px;height:10px;border-radius:50%;background:var(--blue);border:2px solid var(--sys-bg2);box-shadow:0 0 0 2px var(--blue);}
.ev-item.past .ev-dot{background:var(--label-4);box-shadow:0 0 0 2px var(--label-4)}
.ev-body{flex:1;display:flex;align-items:center;padding:var(--sp3) var(--sp4) var(--sp3) var(--sp2);gap:var(--sp2);}
.ev-title{flex:1;font-size:var(--text-body);font-weight:500;color:var(--label-1);}
.ev-item.past .ev-time-col,.ev-item.past .ev-title{color:var(--label-3);}
.now-chip{font-size:10px;font-weight:700;color:var(--green);background:var(--green-light);border-radius:var(--r-full);padding:2px 8px;white-space:nowrap;animation:nowPulse 2s ease-in-out infinite;}
@keyframes nowPulse{0%,100%{opacity:1}50%{opacity:.5}}
.fab-wrap{position:fixed;bottom:calc(var(--sp6) + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;gap:var(--sp3);z-index:20;}
.fab{height:52px;padding:0 var(--sp5);border-radius:var(--r-full);font-size:var(--text-sm);font-weight:700;color:#fff;background:var(--blue);box-shadow:var(--shadow-fab);display:flex;align-items:center;gap:var(--sp2);transition:transform var(--dur-fast) var(--ease-spring),box-shadow var(--dur-fast);-webkit-user-select:none;user-select:none;}
.fab:active{transform:scale(.94);box-shadow:0 2px 8px rgba(0,0,0,.15)}
.fab-icon{font-size:18px;line-height:1}
.sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:30;opacity:0;pointer-events:none;transition:opacity var(--dur-mid);backdrop-filter:blur(2px);}
.sheet-overlay.open{opacity:1;pointer-events:all}
.sheet{position:fixed;bottom:0;left:0;right:0;background:var(--sys-bg2);border-radius:var(--r-xl) var(--r-xl) 0 0;padding:var(--sp2) var(--sp5) calc(var(--sp6) + env(safe-area-inset-bottom));z-index:31;box-shadow:var(--shadow-sheet);transform:translateY(100%);transition:transform var(--dur-slow) var(--ease-spring);max-width:430px;margin:0 auto;}
.sheet.open{transform:translateY(0)}
.sheet-handle{width:36px;height:5px;border-radius:var(--r-full);background:var(--sys-sep);margin:0 auto var(--sp5);}
.sheet-title{font-size:var(--text-md);font-weight:700;color:var(--label-1);margin-bottom:var(--sp5);letter-spacing:-.3px;}
.field-group{margin-bottom:var(--sp4)}
.field-label{font-size:var(--text-xs);font-weight:600;color:var(--label-2);text-transform:uppercase;letter-spacing:.6px;margin-bottom:var(--sp2);}
.field{width:100%;height:var(--hit);background:var(--sys-bg);border-radius:var(--r-md);padding:0 var(--sp4);font-size:var(--text-body);color:var(--label-1);transition:box-shadow var(--dur-fast),background var(--dur-fast);border:1.5px solid transparent;}
.field:focus{background:var(--sys-bg2);border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,122,255,.15);}
.field::placeholder{color:var(--label-3)}
.pri-chips{display:flex;gap:var(--sp2)}
.pri-chip{flex:1;height:var(--hit);border-radius:var(--r-md);font-size:var(--text-sm);font-weight:600;border:1.5px solid var(--sys-sep);color:var(--label-2);transition:all var(--dur-fast);}
.pri-chip.on-high{background:var(--red-light);border-color:var(--red);color:var(--red)}
.pri-chip.on-med{background:var(--orange-light);border-color:var(--orange);color:var(--orange)}
.pri-chip.on-low{background:var(--green-light);border-color:var(--green);color:var(--green)}
.submit-btn{width:100%;height:52px;border-radius:var(--r-xl);background:var(--blue);color:#fff;font-size:var(--text-body);font-weight:700;margin-top:var(--sp5);transition:transform var(--dur-fast) var(--ease-spring),opacity var(--dur-fast);}
.submit-btn:active{transform:scale(.97);opacity:.85}
.section-label{font-size:var(--text-xs);font-weight:600;color:var(--label-2);text-transform:uppercase;letter-spacing:.6px;margin:var(--sp5) 0 var(--sp2) var(--sp1);}
.toast{position:fixed;top:calc(var(--sp6) + env(safe-area-inset-top));left:50%;transform:translateX(-50%) translateY(-8px);background:var(--label-1);color:#fff;padding:var(--sp2) var(--sp5);border-radius:var(--r-full);font-size:var(--text-sm);font-weight:600;opacity:0;pointer-events:none;z-index:100;white-space:nowrap;transition:opacity var(--dur-mid),transform var(--dur-mid) var(--ease-spring);box-shadow:var(--shadow-fab);}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="app">
  <header class="hero">
    <div class="hero-top">
      <div>
        <div class="hero-greeting" id="greetEl">Good morning</div>
        <div class="hero-date" id="dateEl"></div>
      </div>
      <div class="hero-clock" id="clockEl"></div>
    </div>
    <div id="wxWrap"><div class="weather-loading" id="wxStatus">Fetching weather…</div></div>
  </header>
  <nav class="tab-bar">
    <button class="tab on" data-tab="tasks">✅ Tasks <span class="tab-badge" id="tabBadgeTasks">0</span></button>
    <button class="tab" data-tab="schedule">📅 Schedule <span class="tab-badge" id="tabBadgeSchedule">0</span></button>
  </nav>
  <main class="panels">
    <div class="panel on" id="panel-tasks">
      <div class="progress-header">
        <div class="ring-wrap">
          <svg class="ring-svg" viewBox="0 0 52 52" width="52" height="52">
            <circle class="ring-bg" cx="26" cy="26" r="22"/>
            <circle class="ring-fill" id="ringFill" cx="26" cy="26" r="22"/>
          </svg>
          <div class="ring-pct" id="ringPct">0%</div>
        </div>
        <div class="progress-text">
          <div class="progress-title" id="progTitle">Let's get started</div>
          <div class="progress-sub" id="progSub">No tasks yet — add one below</div>
        </div>
      </div>
      <div class="filter-row">
        <button class="filter-pill on" data-f="all">All</button>
        <button class="filter-pill" data-f="active">Active</button>
        <button class="filter-pill" data-f="done">Done ✓</button>
      </div>
      <div class="task-group" id="taskList"></div>
    </div>
    <div class="panel" id="panel-schedule">
      <div class="section-label">Today</div>
      <div class="timeline" id="evList"></div>
    </div>
  </main>
</div>
<div class="fab-wrap">
  <button class="fab" id="fabOpen"><span class="fab-icon">＋</span> Add</button>
</div>
<div class="sheet-overlay" id="overlay"></div>
<div class="sheet" id="sheet" aria-hidden="true">
  <div class="sheet-handle"></div>
  <div class="sheet-title" id="sheetTitle">New Task</div>
  <div id="taskForm">
    <div class="field-group">
      <div class="field-label">What needs to be done?</div>
      <input class="field" id="taskField" type="text" placeholder="e.g. Review the proposal…" autocomplete="off" autocapitalize="sentences">
    </div>
    <div class="field-group">
      <div class="field-label">Priority</div>
      <div class="pri-chips">
        <button class="pri-chip" data-p="high" type="button">🔴 High</button>
        <button class="pri-chip on-med" data-p="med" type="button">🟡 Medium</button>
        <button class="pri-chip" data-p="low" type="button">🟢 Low</button>
      </div>
    </div>
    <button class="submit-btn" id="taskSubmit" type="button">Add Task</button>
  </div>
  <div id="evForm" hidden>
    <div class="field-group">
      <div class="field-label">Event title</div>
      <input class="field" id="evField" type="text" placeholder="e.g. Team standup…" autocomplete="off" autocapitalize="sentences">
    </div>
    <div class="field-group">
      <div class="field-label">Time</div>
      <input class="field" id="evTimeField" type="time">
    </div>
    <button class="submit-btn" id="evSubmit" type="button">Add to Schedule</button>
  </div>
  <div style="margin-top:16px;text-align:center">
    <button id="formToggle" style="font-size:13px;color:var(--blue);font-weight:600;height:44px;padding:0 16px">Switch to schedule event →</button>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
'use strict';
const LS={g:k=>{try{return JSON.parse(localStorage.getItem(k));}catch{return null;}},s:(k,v)=>localStorage.setItem(k,JSON.stringify(v))};
let tasks=LS.g('asst_tasks')||[];let events=LS.g('asst_events')||[];let tUnit=LS.g('asst_temp')||'C';let tFilter='all';let selectedPri='med';let sheetMode='task';
const save=()=>{LS.s('asst_tasks',tasks);LS.s('asst_events',events);};
const DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
function tick(){const n=new Date(),h=n.getHours(),m=String(n.getMinutes()).padStart(2,'0');document.getElementById('clockEl').textContent=(h%12||12)+':'+m;document.getElementById('dateEl').textContent=DAYS[n.getDay()]+', '+MONTHS[n.getMonth()]+' '+n.getDate();const name=LS.g('asst_name')||'';document.getElementById('greetEl').textContent=(h<12?'Good morning':h<17?'Good afternoon':'Good evening')+(name?', '+name:'');}
tick();setInterval(tick,1000);
const WMO={0:['Clear sky','☀️'],1:['Mainly clear','🌤️'],2:['Partly cloudy','⛅'],3:['Overcast','☁️'],45:['Foggy','🌫️'],48:['Foggy','🌫️'],51:['Drizzle','🌦️'],53:['Drizzle','🌦️'],55:['Drizzle','🌧️'],61:['Rain','🌧️'],63:['Rain','🌧️'],65:['Heavy rain','🌧️'],71:['Snow','❄️'],73:['Snow','❄️'],75:['Heavy snow','❄️'],80:['Showers','🌦️'],81:['Showers','🌧️'],82:['Showers','⛈️'],95:['Storm','⛈️'],96:['Storm','⛈️'],99:['Storm','⛈️']};
let wData=null;
function renderWeather(tempC,code,city){const[desc,icon]=WMO[code]||['—','🌡️'],tempF=Math.round(tempC*9/5+32),disp=tUnit==='C'?Math.round(tempC)+'°C':tempF+'°F';wData={tempC,code,city};document.getElementById('wxWrap').innerHTML='<div class="weather-bar"><span class="weather-icon">'+icon+'</span><div class="weather-info"><div class="weather-temp">'+disp+' · '+desc+'</div><div class="weather-loc">📍 '+city+'</div></div><div class="temp-btns"><button class="temp-btn'+(tUnit==='C'?' on':''+'" data-u="C">°C</button><button class="temp-btn')+(tUnit==='F'?' on':'')+('" data-u="F">°F</button></div></div>');document.querySelectorAll('.temp-btn').forEach(b=>b.addEventListener('click',()=>{tUnit=b.dataset.u;LS.s('asst_temp',tUnit);if(wData)renderWeather(wData.tempC,wData.code,wData.city);}));}
(function(){if(!navigator.geolocation){document.getElementById('wxStatus').textContent='Location unavailable';return;}navigator.geolocation.getCurrentPosition(async pos=>{const{latitude:lat,longitude:lon}=pos.coords;try{const[wr,gr]=await Promise.all([fetch('https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lon+'&current_weather=true'),fetch('https://nominatim.openstreetmap.org/reverse?lat='+lat+'&lon='+lon+'&format=json')]);const wj=await wr.json(),gj=await gr.json();renderWeather(wj.current_weather.temperature,wj.current_weather.weathercode,gj.address?.city||gj.address?.town||gj.address?.village||'Here');}catch{document.getElementById('wxStatus').textContent='Weather unavailable';}},()=>{document.getElementById('wxStatus').textContent='Allow location for weather';},{timeout:8000});})();
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
let _tid;function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(_tid);_tid=setTimeout(()=>el.classList.remove('show'),2200);}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,5);}
function renderTasks(){const done=tasks.filter(t=>t.done).length,total=tasks.length,pct=total?Math.round(done/total*100):0;const circ=138.2,offset=circ-(circ*pct/100);document.getElementById('ringFill').style.strokeDashoffset=offset;document.getElementById('ringPct').textContent=pct+'%';document.getElementById('tabBadgeTasks').textContent=tasks.filter(t=>!t.done).length;const pt=document.getElementById('progTitle'),ps=document.getElementById('progSub');if(!total){pt.textContent='Let\'s get started';ps.textContent='No tasks yet — add one below';}else if(pct===100){pt.textContent='All done! 🎉';ps.textContent='Every task is complete. Amazing.';}else if(pct>=50){pt.textContent='Almost there';ps.textContent=done+' of '+total+' tasks done — keep going!';}else{pt.textContent=done+' of '+total+' done';ps.textContent=pct===0?'Just getting started':'You\'re making progress!';}
const show=tFilter==='all'?tasks:tFilter==='done'?tasks.filter(t=>t.done):tasks.filter(t=>!t.done);const list=document.getElementById('taskList');if(!show.length){const msgs={all:['📋','No tasks yet','Tap + below to add your first task'],done:['🎯','Nothing done yet','Complete a task to see it here'],active:['✨','All caught up!','Every task is checked off']};const[em,title,sub]=msgs[tFilter];list.innerHTML='<div class="empty"><div class="empty-emoji">'+em+'</div><div class="empty-title">'+title+'</div><div class="empty-sub">'+sub+'</div></div>';return;}
list.innerHTML=show.map(t=>'<div class="task-item '+(t.done?'done':'')+'"><label class="cb"><input type="checkbox" '+(t.done?'checked':'')+' data-chk="'+esc(t.id)+'"><div class="cb-visual"><svg width="13" height="10" viewBox="0 0 13 10" fill="none"><path d="M1.5 5L5 8.5L11.5 1.5" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div></label><div class="task-body"><div class="task-text">'+esc(t.text)+'</div><div class="task-meta"><span class="pri-tag '+esc(t.pri)+'">'+esc(t.pri)+'</span></div></div><button class="del-hit" data-del="'+esc(t.id)+'"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 3L13 13M13 3L3 13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button></div>').join('');
list.querySelectorAll('[data-chk]').forEach(el=>el.addEventListener('change',()=>{const t=tasks.find(t=>t.id===el.dataset.chk);if(t){t.done=el.checked;save();renderTasks();}}));
list.querySelectorAll('[data-del]').forEach(el=>el.addEventListener('click',()=>{tasks=tasks.filter(t=>t.id!==el.dataset.del);save();renderTasks();toast('Task removed');}));}
function addTask(text,pri){text=(text||'').trim();if(!text)return false;tasks.unshift({id:uid(),text,pri:pri||'med',done:false});save();renderTasks();return true;}
function fmt12(t){const[h,m]=t.split(':').map(Number);return{h:h%12||12,m:String(m).padStart(2,'0'),ap:h>=12?'PM':'AM'};}
function renderEvents(){const list=document.getElementById('evList');document.getElementById('tabBadgeSchedule').textContent=events.length;if(!events.length){list.innerHTML='<div class="empty"><div class="empty-emoji">📅</div><div class="empty-title">Nothing scheduled</div><div class="empty-sub">Tap + to add your first event today</div></div>';return;}const now=new Date(),nowM=now.getHours()*60+now.getMinutes();const sorted=[...events].sort((a,b)=>a.time.localeCompare(b.time));list.innerHTML=sorted.map(ev=>{const[h,m]=ev.time.split(':').map(Number),evM=h*60+m,past=evM<nowM-1,near=!past&&Math.abs(evM-nowM)<=30,{h:h12,m:mm,ap}=fmt12(ev.time);return'<div class="ev-item '+(past?'past':'')+'"><div class="ev-time-col">'+h12+':'+mm+'<br><span class="ev-time-ampm">'+ap+'</span></div><div class="ev-line-col"><div class="ev-dot"></div></div><div class="ev-body"><span class="ev-title">'+esc(ev.title)+'</span>'+(near?'<span class="now-chip">NOW</span>':'')+'<button class="del-hit" data-evdel="'+esc(ev.id)+'"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 3L13 13M13 3L3 13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button></div></div>';}).join('');list.querySelectorAll('[data-evdel]').forEach(el=>el.addEventListener('click',()=>{events=events.filter(e=>e.id!==el.dataset.evdel);save();renderEvents();toast('Event removed');}));}
function addEvent(title,time){title=(title||'').trim();time=(time||'').trim();if(!title||!time)return false;events.push({id:uid(),title,time});save();renderEvents();return true;}
setInterval(renderEvents,60000);
document.querySelectorAll('.tab').forEach(tab=>tab.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));document.querySelectorAll('.panel').forEach(p=>p.classList.remove('on'));tab.classList.add('on');document.getElementById('panel-'+tab.dataset.tab).classList.add('on');}));
document.querySelector('.filter-row').addEventListener('click',e=>{const btn=e.target.closest('.filter-pill');if(!btn)return;tFilter=btn.dataset.f;document.querySelectorAll('.filter-pill').forEach(b=>b.classList.remove('on'));btn.classList.add('on');renderTasks();});
const sheet=document.getElementById('sheet'),overlay=document.getElementById('overlay');
function openSheet(){sheet.classList.add('open');overlay.classList.add('open');setTimeout(()=>document.getElementById(sheetMode==='task'?'taskField':'evField').focus(),350);}
function closeSheet(){sheet.classList.remove('open');overlay.classList.remove('open');document.getElementById('fabOpen').focus();}
document.getElementById('fabOpen').addEventListener('click',openSheet);
overlay.addEventListener('click',closeSheet);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();});
document.querySelectorAll('.pri-chip').forEach(chip=>{chip.addEventListener('click',()=>{document.querySelectorAll('.pri-chip').forEach(c=>c.className='pri-chip');chip.classList.add('on-'+chip.dataset.p);selectedPri=chip.dataset.p;});});
document.getElementById('taskSubmit').addEventListener('click',()=>{if(addTask(document.getElementById('taskField').value,selectedPri)){document.getElementById('taskField').value='';closeSheet();toast('Task added ✓');document.querySelector('[data-tab="tasks"]').click();}else toast('Please enter a task name');});
document.getElementById('taskField').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('taskSubmit').click();});
document.getElementById('evSubmit').addEventListener('click',()=>{if(addEvent(document.getElementById('evField').value,document.getElementById('evTimeField').value)){document.getElementById('evField').value='';closeSheet();toast('Event added ✓');document.querySelector('[data-tab="schedule"]').click();}else toast('Enter a title and time');});
document.getElementById('evField').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('evSubmit').click();});
document.getElementById('formToggle').addEventListener('click',()=>{sheetMode=sheetMode==='task'?'event':'task';const isTask=sheetMode==='task';document.getElementById('taskForm').hidden=!isTask;document.getElementById('evForm').hidden=isTask;document.getElementById('sheetTitle').textContent=isTask?'New Task':'New Event';document.getElementById('formToggle').textContent=isTask?'Switch to schedule event →':'← Switch to task';setTimeout(()=>document.getElementById(isTask?'taskField':'evField').focus(),50);});
const n=new Date();document.getElementById('evTimeField').value=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');
renderTasks();renderEvents();
</script>
</body>
</html>
